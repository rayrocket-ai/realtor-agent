services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/Toronto}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/realtor
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: realtor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realtor"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      COMMAND_DOMAIN: ${COMMAND_DOMAIN:-command.87.99.139.222.sslip.io}
      VOW_DOMAIN: ${VOW_DOMAIN:-homes.rayrealestate.ca}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
